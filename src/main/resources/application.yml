server:
  port: 8081

spring:
  application:
    name: shippingapp
  datasource:
    url: jdbc:h2:mem:productsdb;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    modulo: 2
    servicio: shipping-app