name: shipping-app

services:
  postgres:
    image: docker.io/library/postgres:15
    container_name: postgres_r2dbc
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: shippingapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shippingapp"]
      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployment/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  pgdata: